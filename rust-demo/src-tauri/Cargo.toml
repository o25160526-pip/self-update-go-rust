[package]
name = "rust-demo"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-demo-logic = { path = "../logic" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
