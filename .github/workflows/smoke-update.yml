name: Automatic Update Smoke Gate

on:
  push:
    branches: [main, "release/v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: go-demo/go.sum
      - name: Automatic Go update smoke
        working-directory: go-demo
        run: go test ./updater -race -timeout 300s -run "Automated|DemoKey|Service(Update|Rollback|UpToDate|Offline)"

  rust-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-demo
      - name: Automatic Rust update smoke
        run: cargo test --manifest-path rust-demo/logic/Cargo.toml automated_update_103_to_104_then_rollback
      - name: Rust formatting and lint smoke
        run: |
          cargo fmt --manifest-path rust-demo/Cargo.toml --all
          cargo fmt --manifest-path rust-demo/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust-demo/logic/Cargo.toml --all-targets -- -D warnings
