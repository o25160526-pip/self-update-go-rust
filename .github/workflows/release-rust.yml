name: Build and Release Rust Demo
on:
  push:
    branches: [main, "release/v*"]
    tags: ["v*"]
permissions: { contents: write }
jobs:
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.94.1', components: 'clippy,rustfmt' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust-demo }
      - run: cargo fmt --manifest-path rust-demo/Cargo.toml --all
      - run: cargo fmt --manifest-path rust-demo/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust-demo/logic/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust-demo/logic/Cargo.toml
  build-windows:
    needs: test-logic
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.94.1', targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust-demo, key: win-msvc }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: rust-demo/package-lock.json }
      - name: Resolve version
        id: ver
        run: |
          $ref="${{ github.ref }}"; if($ref -like 'refs/tags/v*'){$v=$ref.Substring(11);$release='true'}elseif($ref -like 'refs/heads/release/v*'){$v=$ref.Substring(20);$release='true'}else{$v='1.0.0';$release='false'}; "version=$v","tag=v$v","release=$release" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Resolve signing key
        env: { SECRET_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}', SECRET_PASSWORD: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}' }
        run: if([string]::IsNullOrWhiteSpace($env:SECRET_KEY)){$k=(Get-Content keys/demo-signing.key.b64 -Raw).Trim();$p=(Get-Content keys/demo-signing.password -Raw).Trim()}else{$k=$env:SECRET_KEY.Trim();$p=$env:SECRET_PASSWORD}; "TAURI_SIGNING_PRIVATE_KEY=$k","TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set version
        run: {$p='rust-demo/src-tauri/tauri.conf.json';$c=Get-Content $p -Raw|ConvertFrom-Json;$c.version='${{ steps.ver.outputs.version }}';$c|ConvertTo-Json -Depth 20|Set-Content $p -Encoding utf8}
      - name: Build Tauri
        working-directory: rust-demo
        run: npm ci; npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Collect artifact
        run: {$b=Get-ChildItem rust-demo/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe|Select-Object -First 1;if(!$b){throw 'no installer'};New-Item artifacts -ItemType Directory -Force|Out-Null;Copy-Item $b.FullName artifacts/rust-demo-windows-x64-setup.exe;Copy-Item ($b.FullName+'.sig') artifacts/rust-demo-windows-x64-setup.exe.sig;./rust-demo/scripts/generate-latest.ps1 -Version '${{ steps.ver.outputs.version }}' -Bundle artifacts/rust-demo-windows-x64-setup.exe -Signature artifacts/rust-demo-windows-x64-setup.exe.sig -Repository '${{ github.repository }}'}
      - uses: actions/upload-artifact@v4.6.2
        with: { name: rust-demo-windows-x64, path: |-
            artifacts/rust-demo-windows-x64-setup.exe
            artifacts/rust-demo-windows-x64-setup.exe.sig
            latest-rust.json }
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ steps.ver.outputs.tag }}" --target "${{ github.sha }}" --title "Release ${{ steps.ver.outputs.tag }}" --notes "Automated release" 2>$null; gh release upload "${{ steps.ver.outputs.tag }}" artifacts/rust-demo-windows-x64-setup.exe artifacts/rust-demo-windows-x64-setup.exe.sig latest-rust.json --clobber
