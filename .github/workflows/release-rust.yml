name: Build and Release Rust Demo

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.94.1", components: "clippy,rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-demo
      - run: cargo fmt --manifest-path rust-demo/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust-demo/logic/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust-demo/logic/Cargo.toml

  build-windows:
    needs: test-logic
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-demo
          key: win-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rust-demo/package-lock.json
      - name: Install dependencies
        working-directory: rust-demo
        run: npm ci
      - name: Require signing key for release
        if: github.ref_type == 'tag'
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
      - name: Configure unsigned CI build
        if: github.ref_type != 'tag'
        run: |
          $path = 'rust-demo/src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
      - name: Build Tauri
        working-directory: rust-demo
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          npm run tauri build -- --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath tauri-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content tauri-build.log | Select-Object -Last 60 | ForEach-Object { Write-Host "::error::$_" }
            throw "tauri build failed with exit code $code"
          }
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-demo-logs
          path: rust-demo/tauri-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect artifact
        run: |
          $bundle = Get-ChildItem rust-demo/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) { throw 'NSIS setup exe was not produced' }
          New-Item artifacts -ItemType Directory -Force | Out-Null
          Copy-Item $bundle.FullName artifacts/rust-demo-windows-x64-setup.exe -Force
          if (Test-Path ($bundle.FullName + '.sig')) { Copy-Item ($bundle.FullName + '.sig') artifacts/rust-demo-windows-x64-setup.exe.sig -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: rust-demo-windows-x64
          path: artifacts/rust-demo-windows-x64-setup.exe
          if-no-files-found: error
      - name: Generate release metadata
        if: github.ref_type == 'tag'
        run: |
          if (!(Test-Path artifacts/rust-demo-windows-x64-setup.exe.sig)) { throw 'Signed updater artifact was not generated' }
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./rust-demo/scripts/generate-latest.ps1 -Version $version -Bundle artifacts/rust-demo-windows-x64-setup.exe -Signature artifacts/rust-demo-windows-x64-setup.exe.sig -Repository "${{ github.repository }}"
          if (!(Test-Path latest-rust.json)) { throw 'latest-rust.json was not generated' }
          (Get-FileHash artifacts/rust-demo-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower() + '  rust-demo-windows-x64-setup.exe' | Set-Content artifacts/rust-demo-windows-x64-setup.exe.sha256
      - name: Publish Rust release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null; if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "Automated desktop update demo release." }
          gh release upload "${{ github.ref_name }}" artifacts/rust-demo-windows-x64-setup.exe artifacts/rust-demo-windows-x64-setup.exe.sig artifacts/rust-demo-windows-x64-setup.exe.sha256 latest-rust.json --clobber
