name: Build and Release Rust Demo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust-demo/package-lock.json
      - name: Resolve version
        id: ver
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "${{ inputs.version }}" }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Resolve signing key
        env:
          SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SECRET_KEY)) { $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content keys/demo-signing.key.b64 -Raw).Trim(); $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = (Get-Content keys/demo-signing.password -Raw).Trim() }
          else { $env:TAURI_SIGNING_PRIVATE_KEY = $env:SECRET_KEY.Trim(); $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:SECRET_PASSWORD }
          "TAURI_SIGNING_PRIVATE_KEY=$env:TAURI_SIGNING_PRIVATE_KEY" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set version and build
        working-directory: rust-demo
        run: |
          npm ci
          $path = 'src-tauri/tauri.conf.json'; $config = Get-Content $path -Raw | ConvertFrom-Json; $config.version = "${{ steps.ver.outputs.version }}"; $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Collect metadata
        run: |
          $bundle = Get-ChildItem rust-demo/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $bundle) { throw "NSIS setup exe was not produced" }
          New-Item artifacts -ItemType Directory -Force | Out-Null
          Copy-Item $bundle.FullName artifacts/rust-demo-windows-x64-setup.exe -Force
          Copy-Item ($bundle.FullName + '.sig') artifacts/rust-demo-windows-x64-setup.exe.sig -Force
          ./rust-demo/scripts/generate-latest.ps1 -Version "${{ steps.ver.outputs.version }}" -Tag "${{ github.ref_name }}" -Bundle artifacts/rust-demo-windows-x64-setup.exe -Signature artifacts/rust-demo-windows-x64-setup.exe.sig -Repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: rust-release-assets
          path: |
            artifacts/rust-demo-windows-x64-setup.exe
            artifacts/rust-demo-windows-x64-setup.exe.sig
            latest-rust.json
          if-no-files-found: error
      - name: Publish tagged release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null; if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "Automated desktop update demo release." }
          gh release upload "${{ github.ref_name }}" artifacts/rust-demo-windows-x64-setup.exe artifacts/rust-demo-windows-x64-setup.exe.sig latest-rust.json --clobber
