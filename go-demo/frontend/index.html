<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Go Demo - Auto Update</title><style>body{font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#1a1a2e;color:#e0e0e0}.container{text-align:center;padding:2rem}.version{font-size:2rem;font-weight:bold;color:#64b5f6}.state{font-size:1.2rem;margin-top:1rem;padding:.5rem 1rem;border-radius:8px;background:#16213e;display:inline-block}.menu{margin-top:1rem;display:flex;gap:.75rem;justify-content:center}.menu button{border:1px solid #375a7f;border-radius:8px;padding:.6rem 1rem;background:#16213e;color:#e0e0e0;cursor:pointer}.menu button:hover{background:#21476b}.log{margin-top:2rem;text-align:left;background:#0d1117;padding:1rem;border-radius:8px;font-family:monospace;font-size:.85rem;max-width:600px;max-height:200px;overflow-y:auto;white-space:pre-wrap}.info{color:#8b949e;font-size:.9rem;margin-top:.5rem}</style></head><body><div class="container"><h1>Hello, version <span id="version" class="version">loading...</span></h1><div class="info" id="info">OS: ... | Arch: ...</div><div class="state" id="state">checking...</div><nav class="menu" aria-label="Updater menu"><button id="rollback" type="button">Rollback phiên bản trước</button></nav><div class="log" id="log">Updater log:</div></div><script src="./src/main.js" type="module"></script></body></html>
